name: Deployment (no human)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: mkdir site && cp index.html site/
      - name: Test
        run: grep -q "Deploy Demo" site/index.html

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: production-auto
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: |
          echo "Deploying commit ${GITHUB_SHA::7} to production"
          echo "### Deployed automatically" >> "$GITHUB_STEP_SUMMARY"
          echo "No human approval. Commit ${GITHUB_SHA::7} went live." >> "$GITHUB_STEP_SUMMARY"
